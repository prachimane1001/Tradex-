<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeX - Real-Time Stock Trading Simulator</title>
  <meta name="description" content="TradeX is a modern paper trading simulator platform for practicing stock trading with virtual funds using real-time US market data and historical charts.">
  
  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Glassmorphism Styles -->
  <link rel="stylesheet" href="/css/styles.css">
  
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Chart.js CDN for interactive stock charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-family: sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 2rem; font-weight: bold; color: #6366f1; margin-bottom: 1rem;">TradeX</div>
        <div>Loading stock market simulation engine...</div>
      </div>
    </div>
  </div>

  <!-- Single Production React Application Bundle (Pure JS, Zero Babel Dependency) -->
  <script src="/js/bundle.js"></script>
</body>
</html>
